name: Delete merged temporary branch

on:
  pull_request_target:
    types: [closed]
    branches: [custom]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Never check out or execute the PR head in this privileged workflow.
      - name: Delete only the merged temporary source branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const { execFileSync, spawnSync } = require('node:child_process');
          const branch = process.env.HEAD_BRANCH;
          if (!branch || ['main', 'custom'].includes(branch)) process.exit(0);
          const path = `repos/${process.env.GH_REPO}/git/ref/heads/${encodeURIComponent(branch)}`;
          const current = spawnSync('gh', ['api', path], { encoding: 'utf8' });
          if (current.status !== 0) {
            if (current.stderr.includes('HTTP 404')) process.exit(0);
            throw new Error('Could not inspect source branch');
          }
          if (JSON.parse(current.stdout).object.sha !== process.env.HEAD_SHA) {
            throw new Error('Source branch advanced after merge; preserving it');
          }
          execFileSync('gh', ['api', '--method', 'DELETE', path.replace('/git/ref/', '/git/refs/')]);
          JS
